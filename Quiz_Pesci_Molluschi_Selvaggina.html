  {
    title:"Tagli Gastronomici, Razze Ovine e Caprine",
    subtitle:"Sezione 10 (Avanzato) — Tagli dell'agnello e conoscenza delle razze",
    advanced:true,
    qs:[
      {n:105,type:"mc",q:"Cos'è il 'Baron' (o Barone) di agnello e da quale combinazione di parti anatomiche si compone?",opts:["La sella anteriore comprendente il collo e le prime sei coste","Il taglio posteriore comprendente la groppa (doppio carré basso) e i due cosciotti (gigot) — riferito a ovini adulti, non agli agnellini","Il filetto intero dell'agnello, disossato e pronto per la cottura","Le due spalle anteriori dell'agnello con osso, tagliate insieme"],correct:1,exp:"Baron (o Barone) di agnello: taglio posteriore comprendente la groppa (doppio carré basso) e i due cosciotti (gigot). Si riferisce a ovini adulti, non agli agnellini. È uno dei tagli più spettacolari per le preparazioni al forno in occasioni importanti."},
      {n:106,type:"mc",q:"Qual è la differenza anatomica tra il Carré alto 'a coste scoperte' e il Carré basso 'a coste coperte' nell'agnello?",opts:["Non esiste differenza sostanziale: sono due nomi commerciali regionali per lo stesso taglio","Il Carré alto si ottiene dalla sella con coste visibili e scalzate (coste scoperte — più scenografiche); il Carré basso proviene dalla stessa zona ma con la carne che copre le coste. Entrambi si ottengono dalla lombata","Il Carré alto include le vertebre cervicali; il Carré basso quelle lombari","Il Carré alto si ottiene dalla sella; il Carré basso si ottiene dal petto"],correct:1,exp:"Carré alto 'a coste scoperte': dalla lombata, con le coste visibili, scalzate (liberate dalla carne per il tratto terminale) — più scenografico per il servizio. Carré basso 'a coste coperte': stessa zona ma con la carne che ricopre le coste — meno scenografico ma più gustoso. Entrambi si ottengono dalla sella/lombata."},
      {n:107,type:"mc",q:"Il Carré '7 coste' è un taglio di servizio molto usato in ristorazione. Come si ottiene esattamente?",opts:["Selezionando le 7 coste più carnose dalla mezza carcassa","Dal Carré alto 'a coste scoperte', disossato e scalzato: si ricavano le prime 7 coste con la carne relativa, pronto per la cottura e la porzionatura scenografica","Dalle 7 vertebre lombari con la relativa copertura muscolare","Dal taglio trasversale della sella che include sempre e solo 7 coste per lato per normativa"],correct:1,exp:"Carré '7 coste': si ottiene dal Carré alto 'a coste scoperte' ulteriormente lavorato — disossato e scalzato per ottenere un pezzo con 7 coste pulite, pronto per la cottura e la porzionatura in cotolette di agnello. Uno dei tagli più utilizzati in alta ristorazione per la sua versatilità e presentazione."},
      {n:108,type:"mc",q:"In una brigata di cucina, uno chef chiede il 'Gigot'. Quale parte dell'agnello sta richiedendo?",opts:["Il carré alto con coste scoperte e scalzate","La spalla anteriore con osso","Il cosciotto posteriore (la coscia), taglio corrispondente al termine francese Gigot","Il baron — taglio comprendente entrambe le cosce e la sella bassa"],correct:2,exp:"Gigot = Cosciotto posteriore (la coscia) dell'agnello. Il termine è francese ma universalmente utilizzato in cucina internazionale. Non va confuso con il Baron (che include i due cosciotti + la sella) né con il Carré (dalla lombata)."},
      {n:109,type:"mc",q:"Devi identificare rapidamente la razza caprina Saanen rispetto alla Camosciata delle Alpi in un allevamento. Quale combinazione di caratteristiche morfologiche le distingue con certezza?",opts:["La Saanen è da carne; la Camosciata da latte — si distinguono solo per l'attitudine produttiva","Saanen: pelo bianco medio-corto, taglia grande (maschi ~90 kg), origine svizzera. Camosciata: pelo corto fulvo con riga mulina (linea dorsale scura) e caratteristica maschera facciale scura, taglia medio-grande. Entrambe da latte ma visivamente inconfondibili","La Saanen è sempre più grande della Camosciata; la Camosciata ha corna sempre assenti","La Saanen è allevata solo in Piemonte; la Camosciata solo in Trentino"],correct:1,exp:"Saanen: pelo bianco medio-corto, taglia grande (maschi ~90 kg, femmine ~60 kg), origine svizzera, da latte, allevata prevalentemente in pianura in sistema stallino. Camosciata delle Alpi: pelo corto e fulvo con riga mulina scura dorsale e maschera facciale scura, taglia medio-grande (maschi fino 100 kg), sistema estensivo alpino. Inconfondibili visivamente."},
      {n:110,type:"mc",q:"La razza caprina Orobica ha caratteristiche che la rendono particolarmente adatta al suo ambiente originario. Quale combinazione area geografica + morfologia è corretta?",opts:["Sicilia (Girgenti) — corna a spirale molto pronunciata e allungata","Zona alpina Orobica (provincie di Sondrio, Lecco, Como, Bergamo) — pelo fine e molto lungo con colorazioni variegate, adatto all'ambiente montano alpino","Sardegna — pelo corto e uniforme di colore bianco-grigio","Campania (Cilento) — corna piatte e ricurve verso il basso"],correct:1,exp:"Orobica: origini incerte, area alpina Orobica (Sondrio, Lecco, Como, Bergamo), attitudine mista latte-carne, caratteristica fondamentale il pelo fine e MOLTO lungo con colorazioni variegate (diversamente dalla Saanen tutta bianca). Adatta agli ambienti montani impervi."},
      {n:111,type:"mc",q:"La razza ovina Bergamasca è classificata 'da carne'. Quali prestazioni zootecniche specifiche e quale sistema di allevamento la contraddistinguono?",opts:["Agnellone di 8-8,5 kg a 30 giorni; sistema stallino intensivo","Agnellone di 30-37 kg in 90-120 giorni (o castrato fino a 80 kg in 16 mesi); taglia grande (maschi adulti > 100 kg); sistema estensivo a piccola transumanza verticale o brado","Agnellone di 15 kg a 30 giorni; sistema a grande transumanza orizzontale","Produzione mista latte-carne con 100 kg di latte in 180 giorni e agnellone di 20 kg a 90 giorni"],correct:1,exp:"Bergamasca: agnellone di 30-37 kg in 90-120 giorni (o castrato fino a 80 kg in 16 mesi); maschi adulti > 100 kg; sistema estensivo a piccola transumanza verticale o brado — performance da carne superiori grazie alle grandi dimensioni."},
      {n:112,type:"mc",q:"La razza ovina Barbaresca deriva da un incrocio tra due razze specifiche con influenza geografica estera. Quale è la combinazione corretta?",opts:["Incrocio tra razza Sarda e Merina — influenza spagnola","Incrocio tra razze Barbarin e Pinzirita — con influenza tunisina / nordafricana; allevata principalmente in Sicilia e Italia meridionale","Incrocio tra Bergamasca e Suffolk — influenza britannica","Incrocio tra Delle Langhe e Comisana — entrambe razze italiane"],correct:1,exp:"Barbaresca: incrocio tra razze Barbarin e Pinzirita — con influenza tunisina / nordafricana; allevata principalmente in Sicilia e Italia meridionale."},
    ]
  },
  {
    title:"Gestione della Selvaggina in Cucina",
    subtitle:"Sezione 11 (Avanzato) — Sicurezza alimentare, flussi e frollatura",
    advanced:true,
    qs:[
      {n:113,type:"mc",q:"Le carni di selvaggina abbattuta richiedono una sequenza operativa precisa per mantenere qualità e sicurezza. Qual è l'ordine CORRETTO delle operazioni?",opts:["Stoccaggio in freezer → eviscerazione → dissanguamento → frollatura → sezionamento","Eviscerazione e dissanguamento RAPIDI sul campo → stoccaggio in cella frigorifera nel più breve tempo possibile → frollatura → sezionamento e lavorazione in ambienti igienici idonei → stoccaggio in cella/freezer","Frollatura immediata a temperatura ambiente → eviscerazione → stoccaggio in cella → sezionamento","Dissanguamento → sezionamento immediato → freezer → frollatura a temperatura di servizio"],correct:1,exp:"L'ordine corretto: eviscerazione e dissanguamento RAPIDI sul campo (fondamentale per la qualità) → cella frigorifera il prima possibile → frollatura controllata → sezionamento e lavorazione in ambienti igienici idonei → stoccaggio in cella/freezer. Ogni inversione di questo ordine compromette qualità e sicurezza alimentare."},
      {n:114,type:"mc",q:"Il flusso logistico della selvaggina cacciata all'interno di una struttura di ristorazione o lavorazione segue un percorso specifico. Qual è la sequenza corretta?",opts:["Cucina → cella di raccolta in pelle/penna → spellatura/sezionamento → dispensa → servizio","Ingresso materie prime → Cella di raccolta (in pelle/penna) → Locale di spellatura e sezionamento → Frigorifero dispensa (carne in tagli) → Cucina","Ingresso → cucina → abbattitore → celle → servizio","Magazzino secco → cella di raccolta → cucina → abbattitore → dispensa"],correct:1,exp:"Flusso logistico corretto: Ingresso materie prime → Cella di raccolta (in pelle/penna) → Locale di spellatura e sezionamento → Frigorifero dispensa (carne in tagli) → Cucina. Questo percorso garantisce il principio di marcia in avanti (no contaminazioni crociate) e la corretta igiene degli ambienti di lavoro."},
      {n:115,type:"mc",q:"Perché la 'frollatura' è un passaggio indispensabile nella gestione della selvaggina da pelo, e cosa avviene chimicamente durante questo processo?",opts:["La frollatura serve solo a igienizzare esternamente le carni prima della lavorazione","Durante la frollatura (maturazione a bassa temperatura controllata), gli enzimi muscolari naturali (catepsine e calpaine) rompono le proteine delle fibre muscolari, aumentando la tenerezza e sviluppando i composti aromatici caratteristici della selvaggina — senza frollatura le carni sono dure e insipide","La frollatura è semplicemente il periodo di congelamento a -18°C prima della cottura","La frollatura rimuove il grasso intramuscolare in eccesso che renderebbe le carni troppo pesanti"],correct:1,exp:"Durante la frollatura (maturazione a bassa temperatura controllata), gli enzimi muscolari naturali (catepsine e calpaine) rompono le proteine delle fibre muscolari, aumentando la tenerezza e sviluppando i composti aromatici caratteristici della selvaggina. Senza frollatura le carni sono dure e insipide — passaggio indispensabile, non facoltativo."},
      {n:116,type:"mc",q:"Un ristoratore riceve un cinghiale da cacciatore. Dopo aver verificato il Mod. 1 e la documentazione per Trichinella, trova che il peso dell'animale è 44 kg. Quale considerazione pratica è più rilevante per la gestione in cucina di questo volume di carne?",opts:["Un cinghiale di 44 kg è troppo piccolo per la ristorazione professionale: vanno preferiti esemplari di almeno 80 kg","Le carni di selvaggina abbattuta devono seguire una catena del freddo rigorosa (eviscerazione rapida sul campo, cella frigorifera immediata, frollatura controllata, sezionamento in ambienti igienici idonei, stoccaggio in cella/freezer); il volume implica pianificazione di menu e gestione dello spazio frigorifero — il tutto con tracciabilità documentata conservata dal ristoratore","Il cinghiale va immediatamente surgelato intero per preservare le carni; lo scongelamento avverrà in cucina il giorno dell'utilizzo","Non esistono obblighi specifici per i ristoratori nella gestione interna della selvaggina, una volta ricevuto il Mod. 1"],correct:1,exp:"44 kg di cinghiale è un volume significativo che richiede: catena del freddo rigorosa (eviscerazione rapida sul campo, cella frigorifera immediata, frollatura controllata, sezionamento in ambienti igienici idonei, stoccaggio in cella/freezer); pianificazione del menu e dello spazio frigorifero; tracciabilità documentata conservata dal ristoratore. Il Mod. 1 e il certificato Trichinella rimangono obbligatori."},
    ]
  }
];

const STORAGE_KEY = 'quiz_paolo_v1';
let state = {answers:{}, marked:{}};
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}}
function loadState(){try{const s=localStorage.getItem(STORAGE_KEY);if(s)state=JSON.parse(s);}catch(e){}}

function buildQuiz(){
  const main=document.getElementById('quiz-main');
  main.innerHTML='';
  const labels=['A','B','C','D'];
  chapters.forEach((ch,ci)=>{
    const chDiv=document.createElement('div');
    chDiv.className='chapter-section';
    if(ch.sectionBreak){
      const totalBase=chapters.filter(c=>!c.advanced).reduce((a,c)=>a+c.qs.length,0);
      const totalAdv=chapters.filter(c=>c.advanced).reduce((a,c)=>a+c.qs.length,0);
      chDiv.insertAdjacentHTML('beforeend',`
        <div class="section-divider">
          <div class="section-divider-banner">
            <div class="adv-badge">🎯 Sezioni Avanzate</div>
            <div class="adv-title">Analisi Critica e Approfondimenti</div>
            <div class="adv-subtitle">Queste sezioni richiedono di collegare concetti, applicarli a scenari reali e ragionare come professionisti della cucina. Nessuna scorciatoia — tutte le opzioni errate sono plausibili.</div>
            <div class="adv-stats">
              <div class="adv-stat"><span class="adv-stat-num">${totalAdv}</span>&nbsp;domande avanzate</div>
              <div class="adv-stat"><span class="adv-stat-num">5</span>&nbsp;sezioni</div>
              <div class="adv-stat"><span class="adv-stat-num">${totalBase+totalAdv}</span>&nbsp;domande totali</div>
            </div>
          </div>
        </div>`);
    }
    const isAdv=!!ch.advanced;
    const lineClass=isAdv?'chapter-line adv':'chapter-line';
    const labelClass=isAdv?'chapter-label adv':'chapter-label';
    const capLabel=isAdv?`Sezione ${ci+1} — Avanzato`:`Sezione ${ci+1}`;
    chDiv.insertAdjacentHTML('beforeend',`
      <div class="chapter-header">
        <div class="${lineClass}"></div>
        <div class="${labelClass}">${capLabel}</div>
        <div class="${lineClass}"></div>
      </div>
      <h2 class="chapter-title">${ch.title}</h2>
      <p class="chapter-subtitle">${ch.subtitle}</p>`);
    ch.qs.forEach(q=>{
      const card=document.createElement('div');
      card.className='question-card'+(isAdv?' adv-card':'');
      card.id=`q${q.n}`;
      const ans=state.answers[q.n];
      const isMarked=!!state.marked[q.n];
      if(ans!==undefined) card.classList.add(ans===q.correct?'answered-correct':'answered-wrong');
      if(isMarked) card.classList.add('marked');
      const numClass=isAdv?'q-number adv':'q-number';
      let innerHtml=`
        <div class="q-meta">
          <span class="${numClass}">Q${q.n}</span>
          <span class="q-type-badge">${q.type==='vf'?'Vero / Falso':'Scelta multipla'}</span>
          ${ans!==undefined?`<span class="answered-stamp ${ans===q.correct?'ok':'ko'}">${ans===q.correct?'✓ Corretto':'✗ Sbagliato'}</span>`:''}
          <button class="mark-btn ${isMarked?'active':''}" onclick="toggleMark(${q.n})" title="Segna per revisione">🔖</button>
        </div>
        <div class="q-text">${q.q}</div>`;
      const isAnswered=ans!==undefined;
      if(q.type==='mc'){
        innerHtml+=`<div class="options">`;
        q.opts.forEach((opt,oi)=>{
          let cls='';
          if(isAnswered){if(oi===q.correct)cls='correct';else if(oi===ans)cls='wrong';}
          const icon=isAnswered?(oi===q.correct?' <span class="opt-icon">✓</span>':(oi===ans?' <span class="opt-icon">✗</span>':'')):'';
          innerHtml+=`<button class="option-btn ${cls}" ${isAnswered?'disabled':''} onclick="answer(${q.n},${oi})">
            <span class="opt-letter">${labels[oi]}</span><span>${opt}</span>${icon}
          </button>`;
        });
        innerHtml+=`</div>`;
      }else{
        innerHtml+=`<div class="vf-options">`;
        [true,false].forEach((val,i)=>{
          let cls='';
          if(isAnswered){if(val===q.correct)cls='correct';else if(val===ans)cls='wrong';}
          innerHtml+=`<button class="vf-btn ${cls}" ${isAnswered?'disabled':''} onclick="answer(${q.n},${val})">${val?'✓ Vero':'✗ Falso'}</button>`;
        });
        innerHtml+=`</div>`;
      }
      if(isAnswered){
        const isCorrect=ans===q.correct;
        const correctLabel=q.type==='vf'?(q.correct?'Vero':'Falso'):`${labels[q.correct]}) ${q.opts[q.correct]}`;
        innerHtml+=`<div class="feedback ${isCorrect?'correct-fb':'wrong-fb'} show">
          <strong>${isCorrect?'✓ Risposta corretta!':'✗ Risposta errata'}</strong>
          ${!isCorrect?`<span class="correct-answer">Risposta corretta: ${correctLabel}</span>`:''}
          ${q.exp}
        </div>`;
      }else{
        innerHtml+=`<div class="feedback" id="fb${q.n}"></div>`;
      }
      card.innerHTML=innerHtml;
      chDiv.appendChild(card);
    });
    main.appendChild(chDiv);
  });
  updateProgress();
}

function answer(qn,val){
  const allQs=chapters.flatMap(c=>c.qs);
  const q=allQs.find(x=>x.n===qn);
  if(!q||state.answers[qn]!==undefined)return;
  state.answers[qn]=val;
  saveState();
  const card=document.getElementById(`q${qn}`);
  const isCorrect=val===q.correct;
  card.classList.add(isCorrect?'answered-correct':'answered-wrong');
  card.querySelectorAll('.option-btn,.vf-btn').forEach(btn=>{btn.disabled=true;});
  const labels=['A','B','C','D'];
  if(q.type==='mc'){
    card.querySelectorAll('.option-btn').forEach((btn,i)=>{
      if(i===q.correct){btn.classList.add('correct');btn.insertAdjacentHTML('beforeend','<span class="opt-icon">✓</span>');}
      else if(i===val){btn.classList.add('wrong');btn.insertAdjacentHTML('beforeend','<span class="opt-icon">✗</span>');}
    });
  }else{
    card.querySelectorAll('.vf-btn').forEach((btn,i)=>{
      const bval=i===0;
      if(bval===q.correct)btn.classList.add('correct');
      else if(bval===val)btn.classList.add('wrong');
    });
  }
  const correctLabel=q.type==='vf'?(q.correct?'Vero':'Falso'):`${labels[q.correct]}) ${q.opts[q.correct]}`;
  const fb=card.querySelector('.feedback');
  if(fb){
    fb.className=`feedback ${isCorrect?'correct-fb':'wrong-fb'} show`;
    fb.innerHTML=`<strong>${isCorrect?'✓ Risposta corretta!':'✗ Risposta errata'}</strong>
      ${!isCorrect?`<span class="correct-answer">Risposta corretta: ${correctLabel}</span>`:''}
      ${q.exp}`;
  }
  const meta=card.querySelector('.q-meta');
  const existing=meta.querySelector('.answered-stamp');
  if(existing)existing.remove();
  const stamp=document.createElement('span');
  stamp.className=`answered-stamp ${isCorrect?'ok':'ko'}`;
  stamp.textContent=isCorrect?'✓ Corretto':'✗ Sbagliato';
  meta.insertBefore(stamp,meta.querySelector('.mark-btn'));
  updateProgress();
  showToast(isCorrect?'✓ Corretto!':'✗ Sbagliato');
}

function toggleMark(qn){
  if(state.marked[qn]){delete state.marked[qn];}else{state.marked[qn]=true;}
  saveState();
  const btn=document.querySelector(`#q${qn} .mark-btn`);
  const card=document.getElementById(`q${qn}`);
  if(btn)btn.classList.toggle('active',!!state.marked[qn]);
  if(card)card.classList.toggle('marked',!!state.marked[qn]);
  showToast(state.marked[qn]?'🔖 Segnata per revisione':'🔖 Segnalazione rimossa');
}

function filterQuestions(type){
  const allQs=chapters.flatMap(c=>c.qs);
  document.querySelectorAll('.question-card').forEach(card=>{
    const qn=parseInt(card.id.replace('q',''));
    const q=allQs.find(x=>x.n===qn);
    let show=true;
    if(type==='unanswered')show=state.answers[qn]===undefined;
    else if(type==='marked')show=!!state.marked[qn];
    else if(type==='wrong')show=state.answers[qn]!==undefined&&state.answers[qn]!==q.correct;
    card.classList.toggle('hidden',!show);
  });
  document.querySelectorAll('.chapter-section').forEach(sec=>{
    const cards=sec.querySelectorAll('.question-card');
    const anyVisible=Array.from(cards).some(c=>!c.classList.contains('hidden'));
    sec.style.display=anyVisible?'':'none';
  });
  const counts={all:'tutte',unanswered:'da rispondere',marked:'segnate',wrong:'sbagliate'};
  showToast(`Filtro: ${counts[type]}`);
}

function updateProgress(){
  const allQs=chapters.flatMap(c=>c.qs);
  const total=allQs.length;
  const answered=Object.keys(state.answers).length;
  const correct=allQs.filter(q=>state.answers[q.n]===q.correct).length;
  document.getElementById('score-badge').textContent=`${correct} / ${answered}`;
  document.getElementById('progress-bar').style.width=`${(answered/total)*100}%`;
}

function showResults(){
  const allQs=chapters.flatMap(c=>c.qs);
  const total=allQs.length;
  const answered=Object.keys(state.answers).length;
  const correct=allQs.filter(q=>state.answers[q.n]===q.correct).length;
  const wrong=answered-correct;
  const pct=answered>0?Math.round((correct/answered)*100):0;
  const emoji=pct>=85?'🎉':pct>=65?'💪':'📚';
  const scoreClass=pct>=85?'good':pct>=65?'ok':'';
  const msg=pct>=85?'Ottimo risultato!':pct>=65?'Buon lavoro!':'Continua a studiare!';
  const baseChaps=chapters.filter(c=>!c.advanced);
  const advChaps=chapters.filter(c=>c.advanced);
  function chScore(ch){
    const c=ch.qs.filter(q=>state.answers[q.n]===q.correct).length;
    const a=ch.qs.filter(q=>state.answers[q.n]!==undefined).length;
    return `${c}/${a}`;
  }
  let html=`
    <div class="results-emoji">${emoji}</div>
    <div class="results-title">${msg}</div>
    <div class="results-score-big ${scoreClass}">${pct}%</div>
    <div class="results-sub">${correct} corrette su ${answered} risposte (${total-answered} non risposte)</div>
    <div class="results-breakdown">
      <div class="breakdown-item green"><span class="bi-num">${correct}</span><span class="bi-label">Corrette</span></div>
      <div class="breakdown-item red"><span class="bi-num">${wrong}</span><span class="bi-label">Sbagliate</span></div>
      <div class="breakdown-item yellow"><span class="bi-num">${total-answered}</span><span class="bi-label">Non risposte</span></div>
      <div class="breakdown-item"><span class="bi-num">${total}</span><span class="bi-label">Totale</span></div>
    </div>
    <div class="results-section-label">Sezioni Base — 1–6</div>`;
  baseChaps.forEach(ch=>{html+=`<div class="results-chapter"><span>${ch.title}</span><span class="ch-score">${chScore(ch)}</span></div>`;});
  html+=`<div class="results-section-label adv">🎯 Sezioni Avanzate — 7–11</div>`;
  advChaps.forEach(ch=>{html+=`<div class="results-chapter adv-chapter"><span>${ch.title}</span><span class="ch-score">${chScore(ch)}</span></div>`;});
  html+=`<div class="results-actions">
    <button class="res-btn secondary" onclick="document.getElementById('results-panel').classList.remove('show')">← Chiudi</button>
    <button class="res-btn primary" onclick="confirmReset()">🔄 Ricomincia</button>
  </div>`;
  document.getElementById('results-box').innerHTML=html;
  document.getElementById('results-panel').classList.add('show');
}

function confirmReset(){
  if(confirm('Vuoi davvero ricominciare? Tutti i progressi verranno persi.')){
    state={answers:{},marked:{}};
    saveState();
    document.getElementById('results-panel').classList.remove('show');
    buildQuiz();
    showToast('🔄 Quiz riavviato!');
  }
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2000);
}

loadState();
buildQuiz();
</script>
</body>
</html>
